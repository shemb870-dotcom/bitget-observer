name: observer-scan
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run scan
        run: python3 -m observer.scan
      - name: Commit report
        run: |
          git config user.name "observer-bot"
          git config user.email "observer-bot@users.noreply.github.com"
          git add reports data
          git diff --cached --quiet || git commit -m "scan $(date -u +%FT%TZ)"
          git push
